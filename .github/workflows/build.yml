name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NQ_BUILD_TMP: build/tmp
  NQ_BIN_DIR: build/tmp/bin
  NQ_CLIENT_DIR: build/tmp/bin/nqwasm

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      server: ${{ steps.filter.outputs.server }}
      nexus: ${{ steps.filter.outputs.nexus }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          head_sha="${GITHUB_SHA}"
          base_sha=""
          last_success_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          fi

          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=50"
          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${runs_url}" || true)"

          if [[ -n "${runs_json}" ]]; then
            if [[ "$event_name" == "pull_request" ]]; then
              pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
              if [[ -n "$pr_number" && "$pr_number" != "null" ]]; then
                last_success_sha="$(jq -r --argjson pr "$pr_number" '
                  [.workflow_runs[]
                   | select(.event == "pull_request")
                   | select(any(.pull_requests[]?; .number == $pr))
                   | .head_sha] | .[0] // empty
                ' <<<"${runs_json}")"
              fi
            else
              branch_name="${GITHUB_REF_NAME:-}"
              if [[ -n "$branch_name" ]]; then
                last_success_sha="$(jq -r --arg branch "$branch_name" '
                  [.workflow_runs[]
                   | select(.event == "push")
                   | select(.head_branch == $branch)
                   | .head_sha] | .[0] // empty
                ' <<<"${runs_json}")"
              fi
            fi
          fi

          if [[ -n "$last_success_sha" && "$last_success_sha" != "null" ]]; then
            if ! git cat-file -e "${last_success_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth 1 origin "${last_success_sha}" >/dev/null 2>&1 || true
            fi
            if git cat-file -e "${last_success_sha}^{commit}" 2>/dev/null; then
              base_sha="${last_success_sha}"
              echo "Using last successful workflow SHA as diff base: ${base_sha}"
            fi
          fi

          if [[ -z "$base_sha" || "$base_sha" == "null" ]]; then
            if [[ "$event_name" == "pull_request" ]]; then
              base_sha="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
            else
              base_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            fi
          fi
          if [[ -z "$base_sha" || "$base_sha" == "null" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "Diff range: ${base_sha}..${head_sha}"
          git diff --name-only "$base_sha" "$head_sha" | tee changed_files.txt

          wasm=false
          server=false
          nexus=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              client/*|build/build-client.sh|build/prepare-upstream.sh|build/platform.sh|VERSION)
                wasm=true
                ;;
            esac
            case "$path" in
              server/*|build/build-server.sh|build/prepare-upstream.sh|build/platform.sh)
                server=true
                ;;
            esac
            case "$path" in
              nexus/*)
                nexus=true
                ;;
            esac
          done < changed_files.txt

          echo "wasm=${wasm}" >> "$GITHUB_OUTPUT"
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "nexus=${nexus}" >> "$GITHUB_OUTPUT"
          echo "Detected: wasm=${wasm} server=${server} nexus=${nexus}"

  build-wasm-client:
    name: Build WASM Client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wasm == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.0"

      - name: Install dependencies
        run: |
          if command -v git >/dev/null 2>&1 && command -v patch >/dev/null 2>&1; then
            echo "git and patch already available; skipping apt install"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends git patch
          fi

      - name: Build WASM client
        run: |
          rm -rf "${NQ_BUILD_TMP}"
          OUT_DIR="${NQ_CLIENT_DIR}" CLIENT_BUILD_DIR="${NQ_BUILD_TMP}/client" build/build-client.sh

      - name: Verify WASM output
        run: |
          test -f "${NQ_CLIENT_DIR}/index.html"
          test -f "${NQ_CLIENT_DIR}/shell.css"
          test -f "${NQ_CLIENT_DIR}/favicon.svg"
          test -f "${NQ_CLIENT_DIR}/index.js"
          test -f "${NQ_CLIENT_DIR}/index.wasm"
          file "${NQ_CLIENT_DIR}/index.wasm"
          ls -lh "${NQ_CLIENT_DIR}/index.html" "${NQ_CLIENT_DIR}/shell.css" "${NQ_CLIENT_DIR}/favicon.svg" "${NQ_CLIENT_DIR}/index.js" "${NQ_CLIENT_DIR}/index.wasm"

      - name: Stage WASM artifacts
        run: |
          mkdir -p "${NQ_BUILD_TMP}/artifact"
          rm -rf "${NQ_BUILD_TMP}/artifact/nqwasm"
          cp -a "${NQ_CLIENT_DIR}" "${NQ_BUILD_TMP}/artifact/nqwasm"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nqwasm-client
          path: build/tmp/artifact
          retention-days: 7

  build-netquake-servers:
    name: Build NetQuake Server (${{ matrix.display_name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            cc: aarch64-linux-gnu-gcc
            display_name: ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            git patch make \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu

      - name: Build NetQuake server
        run: |
          rm -rf "${NQ_BUILD_TMP}"
          OUT="${NQ_BIN_DIR}/nqserver" PLATFORM="${{ matrix.platform }}" CC="${{ matrix.cc }}" build/build-server.sh

      - name: Verify binary
        run: |
          test -f "${NQ_BIN_DIR}/nqserver"
          file "${NQ_BIN_DIR}/nqserver"
          ls -lh "${NQ_BIN_DIR}/nqserver"

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: nqserver-${{ matrix.arch }}
          path: build/tmp/bin/nqserver
          retention-days: 7

  build-go-nexus:
    name: Build Go Nexus (${{ matrix.display_name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nexus == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            display_name: ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Go nexus
        run: |
          mkdir -p "${NQ_BIN_DIR}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cd nexus
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X github.com/brstm/NexQuake/nexus.gitSHA=${GITHUB_SHA} -X github.com/brstm/NexQuake/nexus.buildTime=${BUILD_TIME}" \
            -o "../${NQ_BIN_DIR}/nexus" .

      - name: Verify binary
        run: |
          test -f "${NQ_BIN_DIR}/nexus"
          file "${NQ_BIN_DIR}/nexus"
          ls -lh "${NQ_BIN_DIR}/nexus"

      - name: Upload nexus binary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.arch }}
          path: build/tmp/bin/nexus
          retention-days: 7

  build-summary:
    name: Build Summary
    needs: [changes, build-wasm-client, build-netquake-servers, build-go-nexus]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          ok() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          if ok "${{ needs.build-wasm-client.result }}" && \
             ok "${{ needs.build-netquake-servers.result }}" && \
             ok "${{ needs.build-go-nexus.result }}"; then
            echo "All builds succeeded!"
            exit 0
          else
            echo "Some builds failed"
            echo "Change detection: wasm=${{ needs.changes.outputs.wasm }} server=${{ needs.changes.outputs.server }} nexus=${{ needs.changes.outputs.nexus }}"
            echo "WASM Client: ${{ needs.build-wasm-client.result }}"
            echo "NetQuake Servers: ${{ needs.build-netquake-servers.result }}"
            echo "Go Nexus: ${{ needs.build-go-nexus.result }}"
            exit 1
          fi
