//
// modern keybinds, based on thresh.cfg
//

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind space +jump
bind mouse1 +attack
bind mouse2 "impulse 8"         // lightning gun
bind shift "impulse 7"          // rocket launcher
bind f "impulse 6"              // grenade launcher

//
bind mwheelup "impulse 10"      // next weapon
bind mwheeldown "impulse 12"    // previous weapon

//
bind touch1 +jump           // A
bind touch2 "impulse 12"    // B
bind touch3 +attack         // X
bind touch4 "impulse 10"    // Y
bind touch5 "togglemenu"

//

bind joy_a +jump
bind joy_b "impulse 12"
bind joy_x +attack
bind joy_y "impulse 10"
bind joy_start "togglemenu"
bind joy_rt +attack
bind joy_lt +jump
bind joy_lb "impulse 12"
bind joy_rb "impulse 10"

//
scr_conspeed 3600               // console open/close speed
+speed                          // auto-run
