//
// modern keybinds, based on thresh.cfg
//
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind space +jump
bind mouse1 +attack
bind mouse2 "impulse 8"         // lightning gun
bind shift "impulse 7"          // rocket launcher
bind f "impulse 6"              // grenade launcher
bind mwheelup "impulse 10"      // next weapon
bind mwheeldown "impulse 12"    // previous weapon
+speed                          // auto-run

//
// touch controls
//
bind touch1 +jump           // A
bind touch2 "impulse 12"    // B
bind touch3 +attack         // X
bind touch4 "impulse 10"    // Y
bind touch5 messagemode2
bind touch8 "impulse 7"
bind touch9 "impulse 8"
bind touch_tap1 +attack
bind touch_tap2 +jump

//
// gamepad
//
bind joy_a +jump
bind joy_b "impulse 12"
bind joy_x +attack
bind joy_y "impulse 10"
bind joy_start "togglemenu"
bind joy_rt +attack
bind joy_lt +jump
bind joy_lb "impulse 12"
bind joy_rb "impulse 10"
bind joy_dpad_up "impulse 8"     // lightning gun
bind joy_dpad_down "impulse 6"    // grenade launcher
bind joy_dpad_left "impulse 7"   // rocket launcher
bind joy_dpad_right "impulse 5"  // super nail gun

//
// console open/close speed
scr_conspeed 3600

//
// gameplay defaults
//
crosshair 1                     // on by default (stock Quake ships it off)

