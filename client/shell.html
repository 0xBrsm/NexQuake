<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>NexQuake</title>
    <style>
      body {
        background-color: rgb(32, 32, 32);
        color: rgb(224, 224, 224);
        font-family: Arial,Helvetica,sans-serif;
        font-size: 16px;
        margin: 0px;
      }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten {
        font-family: monospace;
        font-size: 14px;
        width: calc(100% - 24px);
        height: calc(100vh - 24px);
        margin-top: 8px;
        background-color: inherit;
        color: rgb(192, 192, 192);
        border: 1px solid rgb(64, 64, 64);
        resize: none;
        display: none;
        outline: none;
      }
      div.emscripten { text-align: center; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        width: calc(min(100vw, 100vh * (1650/1080)));
        height: calc(min(100vh, 100vw * 1 / (1650/1080)));
        margin-top: calc(0.5 * (100vh - (min(100vh, 100vw * 0.75))));
        display: none;
        outline: none;
      }

      /* NexQuake Loading Screen */
      #nq-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0a0a0a 0%, #1a1410 50%, #0a0a0a 100%);
        z-index: 9000;
      }
      #nq-loader.hidden { display: none; }
      #nq-loader-logo {
        font-family: 'Courier New', monospace;
        font-size: 42px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 8px;
        text-shadow: 0 0 20px rgba(200, 112, 32, 0.4);
      }
      #nq-loader-logo .nex { color: #f0a830; }
      #nq-loader-logo .quake { color: #888; }
      #nq-loader-sub {
        font-family: monospace;
        font-size: 11px;
        color: #555;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 40px;
      }
      #nq-loader-ring {
        width: 64px;
        height: 64px;
        position: relative;
      }
      #nq-loader-ring::before, #nq-loader-ring::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }
      #nq-loader-ring::before {
        top: 0; left: 0; right: 0; bottom: 0;
        border: 2px solid #333;
      }
      #nq-loader-ring::after {
        top: 0; left: 0; right: 0; bottom: 0;
        border: 2px solid transparent;
        border-top-color: #c87020;
        animation: nq-spin 1s ease-in-out infinite;
      }
      @keyframes nq-spin {
        to { transform: rotate(360deg); }
      }
      #nq-loader-status {
        margin-top: 24px;
        font-family: monospace;
        font-size: 12px;
        color: #666;
      }
      #nq-loader-progress {
        width: 200px;
        height: 2px;
        background: #222;
        margin-top: 12px;
        overflow: hidden;
      }
      #nq-loader-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c87020, #f0a830);
        transition: width 0.2s ease;
      }

      /* NexQuake Settings Overlay */
      #nq-overlay-toggle {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10000;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 6px;
        background: rgba(60, 60, 60, 0.7);
        color: #ccc;
        font-size: 20px;
        cursor: pointer;
        line-height: 36px;
        text-align: center;
        padding: 0;
        transition: background 0.15s;
      }
      #nq-overlay-toggle:hover { background: rgba(80, 80, 80, 0.9); color: #fff; }
      #nq-overlay-panel {
        display: none;
        position: fixed;
        top: 0; right: 0;
        width: 340px;
        height: 100vh;
        z-index: 9999;
        background: rgba(20, 20, 20, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ddd;
        font-family: monospace;
        font-size: 13px;
        box-shadow: -2px 0 12px rgba(0,0,0,0.5);
        box-sizing: border-box;
      }
      #nq-overlay-panel.open { display: flex; }
      #nq-overlay-panel h3 { margin: 0 0 10px; color: #fff; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 6px; }
      /* Vertical tabs sidebar - collapses, expands on hover */
      .nq-tabs-wrap {
        position: relative;
        width: 54px;
        min-width: 54px;
        flex-shrink: 0;
        z-index: 1;
      }
      .nq-tabs {
        position: absolute;
        top: 0; left: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        width: 54px;
        background: rgba(10, 10, 10, 0.6);
        border-right: 1px solid #333;
        padding: 8px 0;
        overflow-y: auto;
        overflow-x: hidden;
        transition: width 0.15s ease;
      }
      .nq-tabs:hover {
        width: auto;
        min-width: 54px;
        max-width: 180px;
        box-shadow: 2px 0 8px rgba(0,0,0,0.4);
      }
      .nq-tabs .nq-tab {
        display: block;
        width: 100%;
        padding: 7px 10px;
        font-size: 11px;
        font-family: monospace;
        color: #999;
        background: none;
        border: none;
        border-left: 2px solid transparent;
        cursor: pointer;
        text-align: left;
        transition: color 0.12s, border-color 0.12s, background 0.12s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nq-tabs .nq-tab:hover { color: #ddd; background: rgba(60, 60, 60, 0.4); }
      .nq-tabs .nq-tab.active {
        color: #f0a830;
        border-left-color: #c87020;
        background: rgba(200, 112, 32, 0.1);
      }
      /* Main content area */
      #nq-panel-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 15px;
      }
      #nq-vfs-list {
        list-style: none;
        padding: 0;
        margin: 5px 0 0;
        flex: 1;
        overflow-y: auto;
      }
      #nq-vfs-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 4px;
        border-bottom: 1px solid #333;
        word-break: break-all;
      }
      #nq-vfs-list li .nq-fname { flex: 1; margin-right: 6px; }
      #nq-vfs-list li button {
        background: none;
        border: none;
        color: #999;
        cursor: pointer;
        padding: 2px 4px;
        margin-left: 2px;
        border-radius: 3px;
        display: flex;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
      }
      #nq-vfs-list li:hover button,
      #nq-vfs-list li:focus-within button {
        opacity: 1;
        pointer-events: auto;
      }
      #nq-vfs-list li button:hover { color: #fff; background: rgba(120,120,120,0.3); }
      #nq-vfs-list li button.nq-del:hover { color: #f66; background: rgba(180,60,60,0.2); }
      #nq-vfs-list li button svg { width: 14px; height: 14px; }
      .nq-btn {
        background: rgba(70,70,70,0.7);
        border: 1px solid #555;
        color: #ccc;
        padding: 5px 12px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
        font-family: monospace;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .nq-btn:hover { background: rgba(100,100,100,0.8); color: #fff; }
      .nq-btn:active, #nq-overlay-toggle:active, #nq-vfs-list li button:active {
        transform: scale(0.95);
      }
      .nq-btn svg { width: 14px; height: 14px; }
      .nq-status { font-size: 11px; color: #888; margin-top: 4px; }
      /* Panel footer */
      #nq-panel-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 10px;
        margin-top: auto;
        border-top: 1px solid #333;
      }
      #nq-branding {
        font-size: 10px;
        color: #8c8c8c;
        letter-spacing: 0.5px;
      }
      #nq-branding span { color: #c87020; }
      #nq-branding em { color: #8c8c8c; }
      #nq-upload-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      #nq-vfs-upload { align-self: flex-end; }
      #nq-vfs-status {
        position: absolute;
        right: 0;
        bottom: calc(100% + 6px);
        margin: 0;
        padding: 3px 6px;
        max-width: 220px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #c0c0c0;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      #nq-vfs-status:empty { display: none; }
      /* Editor overlay - 40% width, right-aligned */
      #nq-editor {
        display: none;
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 40%;
        min-width: 420px;
        max-width: 800px;
        z-index: 10001;
        background: rgba(16, 16, 16, 0.96);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        flex-direction: column;
        padding: 16px;
        box-sizing: border-box;
        box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      }
      #nq-editor.open { display: flex; }
      #nq-editor-path {
        font-size: 13px;
        color: #f0a830;
        font-family: monospace;
        margin-bottom: 8px;
        flex-shrink: 0;
      }
      #nq-editor-text {
        flex: 1;
        width: 100%;
        resize: none;
        background: rgba(0,0,0,0.5);
        border: 1px solid #444;
        color: #ddd;
        font-family: monospace;
        font-size: 13px;
        padding: 10px;
        box-sizing: border-box;
        line-height: 1.4;
        tab-size: 4;
      }
      #nq-editor-text:focus { outline: 1px solid #c87020; border-color: #c87020; }
      #nq-editor-btns {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <!-- NexQuake Loading Screen -->
    <div id="nq-loader">
      <div id="nq-loader-logo"><span class="nex">Nex</span><span class="quake">Quake</span></div>
      <div id="nq-loader-sub">WebAssembly</div>
      <div id="nq-loader-ring"></div>
      <div id="nq-loader-status">Initializing...</div>
      <div id="nq-loader-progress"><div id="nq-loader-progress-bar"></div></div>
    </div>
    <progress value="0" max="100" id="progress" hidden=1></progress>
    <textarea class="emscripten" id="output" readonly></textarea>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <a id="exportFile" hidden=1></a>

    <!-- NexQuake Settings Overlay -->
    <button id="nq-overlay-toggle" title="NexQuake Settings">&#9881;</button>
    <div id="nq-overlay-panel">
      <div class="nq-tabs-wrap"><div class="nq-tabs" id="nq-vfs-tabs"></div></div>
      <div id="nq-panel-content">
        <h3>Configs &amp; Saves</h3>
        <ul id="nq-vfs-list"></ul>
        <div id="nq-panel-footer">
          <div id="nq-branding"><span>Nex</span>Quake <em>v__NEXQUAKE_VERSION__</em></div>
          <div id="nq-upload-wrap">
            <button class="nq-btn" id="nq-vfs-upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload</button>
            <input type="file" id="nq-vfs-file" accept=".cfg,.dem,.sav" style="display:none" multiple>
            <div class="nq-status" id="nq-vfs-status"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Full-window cfg editor -->
    <div id="nq-editor">
      <div id="nq-editor-path"></div>
      <textarea id="nq-editor-text" spellcheck="false"></textarea>
      <div id="nq-editor-btns">
        <button class="nq-btn" id="nq-editor-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save</button>
        <button class="nq-btn" id="nq-editor-cancel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Cancel</button>
      </div>
    </div>

    <script type='text/javascript'>
      var loaderElement = document.getElementById('nq-loader');
      var loaderStatusElement = document.getElementById('nq-loader-status');
      var loaderProgressBar = document.getElementById('nq-loader-progress-bar');
      var progressElement = document.getElementById('progress');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      var exportElement = document.getElementById('exportFile');
      var NEXQUAKE_GAMENAME = '__NEXQUAKE_GAMENAME__';

      function nqNormalizeGameName(name) {
        name = String(name || '').trim();
        return name || NEXQUAKE_GAMENAME;
      }

      function nqGetBaseGameName() {
        return nqNormalizeGameName(Module.nexquakeBaseGameName || NEXQUAKE_GAMENAME);
      }

      function nqSafeReadDir(path) {
        try { return FS.readdir(path); } catch (e) { return []; }
      }

      function nqSafeStat(path) {
        try { return FS.stat(path); } catch (e) { return null; }
      }

      function nqSafeMkdirTree(path) {
        try { FS.mkdirTree(path); } catch (e) {}
      }

      function nqSafeUnlink(path) {
        try { FS.unlink(path); } catch (e) {}
      }

      function nqSafeSyncFS() {
        try { FS.syncfs(false, function(){}); } catch (e) {}
      }

      var Module = {
        nexquakeBaseGameName: NEXQUAKE_GAMENAME,
        preRun: [function() {
          var normalizeGameName = nqNormalizeGameName;
          var getBaseGameName = nqGetBaseGameName;

          function ensureGameDir(mod) {
            mod = normalizeGameName(mod);
            try { FS.mkdir('/' + mod); } catch (e) {}
            return mod;
          }

          // Create the baseline game mount root.
          ensureGameDir(getBaseGameName());

          function ensureDirForPath(path) {
            var parts = String(path).split('/').filter(Boolean);
            if (parts.length <= 1) return;
            parts.pop(); // filename
            try { FS.mkdirTree('/' + parts.join('/')); } catch (e) {}
          }

          // Remote assets act like pack files: they are readable, but "loose" user files
          // should take precedence. To achieve this we:
          // - avoid overwriting existing local files when installing remote nodes
          // - promote a remote node to a real writable file on first write attempt
          // - recreate a remote node on-demand when a read fails with ENOENT
          if (!Module.nexquakeRemoteFiles) Module.nexquakeRemoteFiles = Object.create(null);
          if (!Module.nexquakeRemoteURLs) Module.nexquakeRemoteURLs = Object.create(null);
          if (!Module.nexquakeInstalledManifests) Module.nexquakeInstalledManifests = Object.create(null);
          Module.nexquakeActiveGame = normalizeGameName(Module.nexquakeActiveGame || getBaseGameName());

          function resolveVFSPath(p) {
            p = String(p || '');
            if (!p) return p;
            try {
              if (p[0] === '/') return PATH.normalize(p);
              return PATH.normalize(FS.cwd() + '/' + p);
            } catch (e) {
              if (p[0] === '/') return p;
              var cwd = (typeof FS !== 'undefined' && FS && typeof FS.cwd === 'function') ? FS.cwd() : '/';
              if (!cwd.endsWith('/')) cwd += '/';
              return cwd + p;
            }
          }

          function isWriteOpenFlags(flags) {
            if (typeof flags === 'string') {
              // "w", "a", and "+" imply write intent.
              return flags.indexOf('w') !== -1 || flags.indexOf('a') !== -1 || flags.indexOf('+') !== -1;
            }
            // Numeric flags: POSIX open() uses O_RDONLY=0, O_WRONLY=1, O_RDWR=2.
            // (flags & 3) != 0 indicates a write-capable open.
            return (flags & 3) !== 0;
          }

          // Emscripten's built-in FS.createLazyFile only supports browser lazy-loading in Web Workers.
          // NexQuake runs on the main thread, so we implement a tiny "lazy remote file" wrapper:
          // - Create the file node up-front so Quake can open it.
          // - On first read/open, download the full file into MEMFS (blocking via ASYNCIFY).
          // This preserves Quake's synchronous filesystem model while avoiding upfront downloads.
          function createRemoteFile(parent, name, url, size) {
            var node = FS.createFile(parent, name, null, true, false);
            node.url = url;
            node.usedBytes = Number.isFinite(size) && size > 0 ? size : 0;
            node.nqErrorCount = 0;
            node.nqRetryAfterMs = 0;
            node.nqLastLoadError = '';
            // Export a handle so we can prefetch into this node later.

            function ensureLoaded() {
              if (node.contents) return;
              if (node.nqRetryAfterMs && Date.now() < node.nqRetryAfterMs) {
                throw new Error(node.nqLastLoadError || ('remote file fetch throttled for ' + node.url));
              }
              // Synchronous XHR is still permitted on the main thread, but Chrome disallows
              // setting responseType for sync requests. Use the classic "x-user-defined" path
              // and convert responseText -> Uint8Array.
              var xhr = new XMLHttpRequest();
              try {
                xhr.open('GET', node.url, false);
                try { xhr.overrideMimeType('text/plain; charset=x-user-defined'); } catch (e) {}
                xhr.send(null);
              } catch (e) {
                node.nqErrorCount++;
                node.nqRetryAfterMs = Date.now() + Math.min(15000, 500 * Math.pow(2, Math.min(node.nqErrorCount, 5)));
                node.nqLastLoadError = String(e && e.message ? e.message : e);
                throw e;
              }

              if (xhr.status !== 200 && xhr.status !== 0) {
                node.nqErrorCount++;
                node.nqRetryAfterMs = Date.now() + Math.min(15000, 500 * Math.pow(2, Math.min(node.nqErrorCount, 5)));
                node.nqLastLoadError = 'remote file fetch failed: ' + xhr.status + ' for ' + node.url;
                throw new Error(node.nqLastLoadError);
              }

              var text = xhr.responseText || '';
              var bytes = new Uint8Array(text.length);
              for (var i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xFF;
              node.contents = bytes;
              node.usedBytes = bytes.length;
              node.nqErrorCount = 0;
              node.nqRetryAfterMs = 0;
              node.nqLastLoadError = '';
            }

            node.stream_ops = {
              open: function() {
                ensureLoaded();
              },
              close: function() {},
              read: function(stream, buffer, offset, length, position) {
                ensureLoaded();
                var contents = node.contents;
                if (!contents) return 0;
                var size = contents.length;
                if (position >= size) return 0;
                var end = Math.min(size, position + length);
                buffer.set(contents.subarray(position, end), offset);
                return end - position;
              },
              llseek: function(stream, offset, whence) {
                var position = offset;
                if (whence === 1) position += stream.position;
                else if (whence === 2) position += node.usedBytes;
                if (position < 0) throw new FS.ErrnoError(28); // EINVAL
                return position;
              }
            };

            return node;
          }

          (function installUnionOpenShim() {
            if (!FS || !FS.open) return;
            if (FS._nexquake_union_open_shim) return;
            FS._nexquake_union_open_shim = true;

            var origOpen = FS.open;
            FS.open = function(path, flags, mode) {
              try {
                return origOpen.call(FS, path, flags, mode);
              } catch (e) {
                var absPath = resolveVFSPath(path);

                if (isWriteOpenFlags(flags)) {
                  // If a remote (read-only) node exists at this path, replace it with a real
                  // local file so Quake can write (and we can persist) user-owned content.
                  try {
                    var node = FS.lookupPath(absPath).node;
                    if (node && node.url) {
                      try { FS.unlink(absPath); } catch (e2) {}
                      try { if (Module.nexquakeRemoteFiles) delete Module.nexquakeRemoteFiles[absPath]; } catch (e3) {}
                      return origOpen.call(FS, path, flags, mode);
                    }
                  } catch (e4) {}
                } else if (e && e.errno === 2) { // ENOENT
                  // If a remote mapping exists for this path, recreate the remote stub and retry.
                  try {
                    var ent = Module.nexquakeRemoteURLs && Module.nexquakeRemoteURLs[absPath];
                    if (ent && ent.url) {
                      ensureDirForPath(absPath);
                      var parent = absPath.substring(0, absPath.lastIndexOf('/')) || '/';
                      var name = absPath.substring(absPath.lastIndexOf('/') + 1);
                      var node = createRemoteFile(parent, name, ent.url, Number(ent.size || 0));
                      try { if (Module.nexquakeRemoteFiles) Module.nexquakeRemoteFiles[absPath] = node; } catch (e2) {}
                      return origOpen.call(FS, path, flags, mode);
                    }
                  } catch (e5) {}
                }
                throw e;
              }
            };
          })();

          function installLazyFile(mod, vfsRelPath, url, size) {
            mod = normalizeGameName(mod);
            vfsRelPath = String(vfsRelPath || '').replace(/^\/+/, '');
            url = String(url || '').trim();
            if (!vfsRelPath || !url) return;

            // Store everything as lowercase in the VFS (Quake expects lowercase paths).
            var lowerRel = vfsRelPath.split('/').filter(Boolean).map(function(p) { return p.toLowerCase(); }).join('/');
            var outPath = '/' + mod + '/' + lowerRel;
            var parent = outPath.substring(0, outPath.lastIndexOf('/')) || '/';
            var name = outPath.substring(outPath.lastIndexOf('/') + 1);

            try {
              if (!Module.nexquakeRemoteURLs) Module.nexquakeRemoteURLs = Object.create(null);
              Module.nexquakeRemoteURLs[outPath] = { url: url, size: Number(size || 0) };
            } catch (e) {}

            ensureDirForPath(outPath);

            // Do not replace existing local files. Loose files should override "pak-like"
            // remote assets, matching default Quake precedence.
            try {
              var existing = FS.lookupPath(outPath).node;
              if (existing) {
                if (existing.url) {
                  existing.url = url;
                  existing.usedBytes = Number.isFinite(size) && size > 0 ? size : existing.usedBytes;
                  try { if (Module.nexquakeRemoteFiles) Module.nexquakeRemoteFiles[outPath] = existing; } catch (e2) {}
                }
                return;
              }
            } catch (e) {}

            try {
              var node = createRemoteFile(parent, name, url, size);

              refresh();
            };
            li.appendChild(delBtn);

            list.appendChild(li);
          });
        }

        // Inline editor
        function openEditor(displayPath, backupPath) {
          try {
            var data = FS.readFile(backupPath, {encoding: 'utf8'});
            editingFile = {display: displayPath, backup: backupPath};
            editorPath.textContent = displayPath;
            editorText.value = data;
            editor.classList.add('open');
            editorText.setSelectionRange(0, 0);
            editorText.scrollTop = 0;
            editorText.focus();
          } catch(e) {
            setStatus('Failed to read file', true);
          }
        }

        function closeEditor() {
          if (!editor.classList.contains('open')) return false;
          editor.classList.remove('open');
          editingFile = null;
          editorText.value = '';
          return true;
        }

        editorSave.onclick = function() {
          if (!editingFile) return;
          var content = editorText.value;
          var data = new TextEncoder().encode(content);
          try {
            FS.writeFile(editingFile.backup, data);
            FS.writeFile(editingFile.display, data);
            safeSyncFS();
            setStatus('Saved ' + editingFile.display);
            closeEditor();
            refresh();
          } catch(e) {
            setStatus('Save failed', true);
          }
        };

        editorCancel.onclick = closeEditor;

        // Upload
        function getUploadDir() {
          return (currentDir === '__all__') ? '/id1/' : currentDir;
        }

        var UPLOAD_EXTS = ['cfg', 'dem', 'sav'];
        function isValidUpload(name) {
          var ext = name.slice(name.lastIndexOf('.') + 1).toLowerCase();
          return UPLOAD_EXTS.indexOf(ext) >= 0;
        }

        function uploadFile(file) {
          if (!file || !isValidUpload(file.name)) {
            setStatus('Quake .cfg, .dem, .sav only.', true);
            return;
          }
          var dir = getUploadDir();
          var dirPath = dir.replace(/\/$/, '');
          var backupDir = USERFS + dirPath;
          var reader = new FileReader();
          reader.onload = function(e) {
            var data = new Uint8Array(e.target.result);
            var name = file.name.toLowerCase();
            try {
              safeMkdirTree(dirPath);
              safeMkdirTree(backupDir);
              safeUnlink(dir + name);
              safeUnlink(backupDir + '/' + name);
              FS.createDataFile(dirPath, name, data, true, true, true);
              FS.writeFile(backupDir + '/' + name, data);
              safeSyncFS();
              setStatus(name + ' \u2192 ' + dir);
              refresh();
            } catch(err) {
              setStatus('Upload failed', true);
            }
          };
          reader.readAsArrayBuffer(file);
        }

        function processUploads(files) {
          forEachFile(files, uploadFile);
        }

        upload.onclick = function() { fileInput.click(); };
        fileInput.onchange = function(e) {
          processUploads(e.target.files);
          fileInput.value = '';
        };

        // Drag-drop
        list.addEventListener('dragover', function(e) { e.preventDefault(); list.style.background = 'rgba(80,80,80,0.4)'; });
        list.addEventListener('dragleave', function(e) { e.preventDefault(); list.style.background = ''; });
        list.addEventListener('drop', function(e) {
          e.preventDefault();
          list.style.background = '';
          processUploads(e.dataTransfer && e.dataTransfer.files);
        });

        // Init
        var origInit = Module.onRuntimeInitialized;
        Module.onRuntimeInitialized = function() {
          if (origInit) origInit.call(Module);
          refresh();
        };
        Module.nqOverlayUpdateDirs = function() { refresh(); };
      })();

      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        loaderElement.classList.add('hidden');
        Module.setStatus = function(text) {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
