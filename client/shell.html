<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>NexQuake</title>
    <style>
      body {
        background-color: rgb(32, 32, 32);
        color: rgb(224, 224, 224);
        font-family: Arial,Helvetica,sans-serif;
        font-size: 16px;
        margin: 0px;
      }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten {
        font-family: monospace;
        font-size: 14px;
        width: calc(100% - 24px);
        height: calc(100vh - 24px);
        margin-top: 8px;
        background-color: inherit;
        color: rgb(192, 192, 192);
        border: 1px solid rgb(64, 64, 64);
        resize: none;
        display: none;
        outline: none;
      }
      div.emscripten { text-align: center; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        width: calc(min(100vw, 100vh * (1650/1080)));
        height: calc(min(100vh, 100vw * 1 / (1650/1080)));
        margin-top: calc(0.5 * (100vh - (min(100vh, 100vw * 0.75))));
        display: none;
        outline: none;
      }

      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(96,96,96);
        border-right: 10px solid rgb(96,96,96);
        border-bottom: 10px solid rgb(96,96,96);
        border-top: 10px solid rgb(255,255,255);
        border-radius: 100%;
        background-color: rgb(32,32,32);
      }
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

    </style>
  </head>
  <body>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"><strong>NexQuake</strong></center></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>
    <textarea class="emscripten" id="output" readonly></textarea>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <a id="exportFile" hidden=1></a>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      var exportElement = document.getElementById('exportFile');

      var Module = {
        preRun: [function() {
          // Create the virtual folder for game data
          FS.mkdir('/id1');

          function urlJoinDataId1(relPath) {
            var parts = String(relPath).split('/').filter(Boolean).map(encodeURIComponent);
            return '/data/id1/' + parts.join('/');
          }

          function ensureDirForPath(path) {
            var parts = String(path).split('/').filter(Boolean);
            if (parts.length <= 1) return;
            parts.pop(); // filename
            FS.mkdirTree('/' + parts.join('/'));
          }

          // Emscripten's built-in FS.createLazyFile only supports browser lazy-loading in Web Workers.
          // NexQuake runs on the main thread, so we implement a tiny "lazy remote file" wrapper:
          // - Create the file node up-front so Quake can open it.
          // - On first read/open, download the full file into MEMFS (blocking via ASYNCIFY).
          // This preserves Quake's synchronous filesystem model while avoiding upfront downloads.
          function createRemoteFile(parent, name, url, size) {
            var node = FS.createFile(parent, name, null, true, false);
            node.url = url;
            node.usedBytes = Number.isFinite(size) && size > 0 ? size : 0;
            // Export a handle so we can prefetch into this node later.
            if (!Module.nexquakeRemoteFiles) Module.nexquakeRemoteFiles = Object.create(null);

          function ensureLoaded() {
            if (node.contents) return;
              // Synchronous XHR is still permitted on the main thread, but Chrome disallows
              // setting responseType for sync requests. Use the classic "x-user-defined" path
              // and convert responseText -> Uint8Array.
              var xhr = new XMLHttpRequest();
              xhr.open('GET', node.url, false);
              try { xhr.overrideMimeType('text/plain; charset=x-user-defined'); } catch (e) {}
              xhr.send(null);

              if (xhr.status !== 200 && xhr.status !== 0) {
                throw new Error('remote file fetch failed: ' + xhr.status + ' for ' + node.url);
              }

              var text = xhr.responseText || '';
              var bytes = new Uint8Array(text.length);
              for (var i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xFF;
              node.contents = bytes;
              node.usedBytes = bytes.length;
            }

            node.stream_ops = {
              open: function() {
                ensureLoaded();
              },
              close: function() {},
              read: function(stream, buffer, offset, length, position) {
                ensureLoaded();
                var contents = node.contents;
                if (!contents) return 0;
                var size = contents.length;
                if (position >= size) return 0;
                var end = Math.min(size, position + length);
                buffer.set(contents.subarray(position, end), offset);
                return end - position;
              },
              llseek: function(stream, offset, whence) {
                var position = offset;
                if (whence === 1) position += stream.position;
                else if (whence === 2) position += node.usedBytes;
                if (position < 0) throw new FS.ErrnoError(28); // EINVAL
                return position;
              }
            };

            return node;
          }

          function installLazyFile(vfsRelPath, url, size) {
            vfsRelPath = String(vfsRelPath || '').replace(/^\/+/, '');
            url = String(url || '').trim();
            if (!vfsRelPath || !url) return;

            // Store everything as lowercase in the VFS (Quake expects lowercase paths).
            var lowerRel = vfsRelPath.split('/').filter(Boolean).map(function(p) { return p.toLowerCase(); }).join('/');
            var outPath = '/id1/' + lowerRel;
            var parent = outPath.substring(0, outPath.lastIndexOf('/')) || '/';
            var name = outPath.substring(outPath.lastIndexOf('/') + 1);

            ensureDirForPath(outPath);
            try { FS.unlink(outPath); } catch (e) {}
            var node = createRemoteFile(parent, name, url, size);
            Module.nexquakeRemoteFiles[outPath] = node;
          }

          // Prefetch support (used by the client after parsing svc_serverinfo).
          // The C code enqueues paths, then waits (with emscripten_sleep) for
          // Module.nexquakePrefetchBusy to become 0.
          Module.nexquakePrefetchQueue = Module.nexquakePrefetchQueue || [];
          Module.nexquakePrefetchBusy = 0;

          Module.nexquakePrefetchReset = function() {
            Module.nexquakePrefetchQueue = [];
          };

          Module.nexquakePrefetchEnqueue = function(relPath) {
            relPath = String(relPath || '').replace(/^\/+/, '').trim();
            if (!relPath) return;
            var lowerRel = relPath.split('/').filter(Boolean).map(function(p) { return p.toLowerCase(); }).join('/');
            Module.nexquakePrefetchQueue.push(lowerRel);
          };

          async function prefetchOne(lowerRel) {
            var outPath = '/id1/' + lowerRel;
            var node = Module.nexquakeRemoteFiles && Module.nexquakeRemoteFiles[outPath];
            if (!node || node.contents) return;
            var resp = await fetch(node.url, { cache: 'force-cache' });
            if (!resp.ok) throw new Error('prefetch failed: ' + resp.status + ' for ' + node.url);
            var buf = await resp.arrayBuffer();
            node.contents = new Uint8Array(buf);
            node.usedBytes = node.contents.length;
          }

          async function prefetchMany(paths, concurrency) {
            concurrency = Math.max(1, Math.min(16, Number(concurrency || 6)));
            var uniq = Object.create(null);
            var queue = [];
            for (var i = 0; i < paths.length; i++) {
              var p = String(paths[i] || '').trim();
              if (!p || uniq[p]) continue;
              uniq[p] = true;
              queue.push(p);
            }

            var idx = 0;
            async function worker() {
              while (true) {
                var j = idx++;
                if (j >= queue.length) return;
                try {
                  await prefetchOne(queue[j]);
                } catch (e) {
                  // Best-effort: Quake will still attempt to load synchronously and surface errors.
                }
              }
            }

            var workers = [];
            for (var w = 0; w < concurrency; w++) workers.push(worker());
            await Promise.all(workers);
          }

          Module.nexquakePrefetchStart = function() {
            if (Module.nexquakePrefetchBusy) return;
            var list = (Module.nexquakePrefetchQueue || []).slice();
            Module.nexquakePrefetchQueue = [];
            if (!list.length) return;
            Module.nexquakePrefetchBusy = 1;
            prefetchMany(list, 6)
              .finally(function() { Module.nexquakePrefetchBusy = 0; });
          };

          // Mirror a virtualized manifest into /id1 before starting Quake.
          // Files are installed as lazy-backed VFS entries (download on first read).
          Module.addRunDependency('manifest:id1');

          function fetchManifest() {
            return fetch('/data-manifest/id1').then(function(response) {
              if (!response.ok) throw new Error('manifest fetch failed: ' + response.status);
              return response.json();
            });
          }

          function installManifest(entries) {
            if (!Array.isArray(entries) || entries.length === 0) {
              throw new Error('manifest empty');
            }

            // Ensure the mount root exists.
            try { FS.mkdir('/id1'); } catch (e) {}

            // Backwards compatibility: old manifests were arrays of relative paths.
            if (typeof entries[0] === 'string') {
              entries
                .filter(function(p) { return typeof p === 'string' && p.trim() !== ''; })
                .map(function(p) { return p.trim().replace(/^\/+/, ''); })
                .filter(Boolean)
                .forEach(function(relPath) {
                  installLazyFile(relPath, urlJoinDataId1(relPath));
                });
              return;
            }

            entries.forEach(function(ent) {
              if (!ent || typeof ent !== 'object') return;
              if (typeof ent.path !== 'string' || typeof ent.url !== 'string') return;
              installLazyFile(ent.path, ent.url, Number(ent.size || 0));
            });
          }

          fetchManifest()
            .then(installManifest)
            .then(function() {
              Module.removeRunDependency('manifest:id1');
            })
            .catch(function(err) {
              console.error('Failed to install /id1 manifest:', err);
              try { Module.setStatus('Failed to load game data (see console)'); } catch (e) {}
              // Intentionally do not remove the run dependency: Quake must not start without data.
            });
        }],
        postRun: [],
        _canLockPointer: true,
        print: (function() {
          outputElement.value = ''; // clear browser cache
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          };
        })(),
        canvas: (function() {
          return canvasElement;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        hideConsole: function() {
          outputElement.style.display = 'none';
          canvasElement.style.display = 'block';
          canvasElement.focus();
        },
        showConsole: function() {
          canvasElement.style.display = 'none';
          outputElement.style.display = 'block';
          outputElement.scrollTop = outputElement.scrollHeight;
          outputElement.focus();
        },
        exportFile: function(filePath) {
          try {
            const filePathSplit = filePath.split('/');
            const dataArray = new Uint8Array(FS.readFile(filePath));
            const dataBlob = new Blob([dataArray], {type: 'application/octet-stream'});
            const objURL = URL.createObjectURL(dataBlob);
            exportElement.href = objURL;
            exportElement.download = filePathSplit[filePathSplit.length - 1];
            exportElement.click();
            URL.revokeObjectURL(objURL);
          } catch (error) {
            console.error('Error exporting file:', error);
          }
        },
        setGamma: function(vidGamma) {
          vidGamma = Number(Number(vidGamma).toFixed(2));
          console.info('Detected canvas gamma change: ' + vidGamma);
          canvasElement.style.filter = 'brightness(' + ((1.35 - vidGamma) * 2) + ')';
        },
        captureMouse: function() {
          if (Module._canLockPointer && !Module._attemptPointerLock()) {
            // Unable to lock the pointer immediately, so do it when a key is pressed
            Module._canLockPointer = false;
            console.info('Delayed pointer lock requested.');
            document.addEventListener('keydown', Module._lockPointerOnKey);
          }
        },
        _attemptPointerLock: function() {
          if (document.pointerLockElement === null) {
            // Attempt a pointer lock now if there isn't one present
            canvasElement.requestPointerLock();
          }

          return document.pointerLockElement !== null;
        },
        _lockPointerOnKey: function(event) {
          if ((event.key === 'Escape') || Module._attemptPointerLock()) {
            // Pointer successfully locked, or Esc pressed
            document.removeEventListener('keydown', Module._lockPointerOnKey);
            console.info('Delayed pointer lock complete.');
            Module._canLockPointer = true;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        },
        onRuntimeInitialized: function() {
          outputElement.style.display = 'block';
        }
      };
      (function() {
        var args = [];
        var tokens = window.location.search.length > 1 ? window.location.search.substr(1).split('&') : [];
        for (var i = 0; i < tokens.length; i++) {
          var t = tokens[i];
          if (!t) continue;
          // Keep legacy behavior for flags like ?-nosound but avoid passing key=value params to Quake.
          if (t.indexOf('=') !== -1) continue;
          try { t = decodeURIComponent(t); } catch (e) {}
          args.push(t);
        }

        Module['arguments'] = args;
      })();

      // Best-effort graceful disconnect when the tab/window is closed.
      // Without this, the server may keep the player slot until timeout.
      (function() {
        function requestDisconnect() {
          try {
            if (typeof Module !== 'undefined' && Module && typeof Module.ccall === 'function') {
              Module.ccall('NexQuake_OnPageHide', 'void', [], []);
            }
          } catch (e) {}
        }
        window.addEventListener('pagehide', requestDisconnect);
        window.addEventListener('beforeunload', requestDisconnect);
      })();
      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = function(text) {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
