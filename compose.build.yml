services:
  nexquake:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1337:1337"
    volumes:
      - ./game:/app/game:ro
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/bin/nexus", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# For production: Configure your own reverse proxy to forward to nexus:1337
# Examples: Nginx, Traefik, Caddy, HAProxy, or cloud load balancer
