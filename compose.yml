services:
  nexquake:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-1337}:${HTTP_PORT:-1337}"
    volumes:
      # Game data (id1, mods, mission packs) - read-only.
      # Note: nexus can auto-bootstrap missing game data only when /app/game is writable.
      - ./game:/app/game:ro
      # Server logs, demos, temp files - read-write
      - ./logs:/app/logs:rw
    environment:
      - HTTP_PORT=${HTTP_PORT:-1337}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/bin/nexus", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# For production: Configure your own reverse proxy to forward to nexus:1337
# Examples: Nginx, Traefik, Caddy, HAProxy, or cloud load balancer
