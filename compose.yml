services:
  nexquake:
    image: ghcr.io/0xbrsm/nexquake
    ports:
      - "1337:1337"
    environment:
      # auto-connect if only one server
      - CL_ARGS=+connect
      # quickstarts with a single FFA server
      # set to =all to load all mods
      - QUICKSTART=ffa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/bin/nexus", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# For production: Configure your own reverse proxy to forward to Nexus at `nexus:1337`
# Examples: Nginx, Traefik, Caddy, HAProxy, or cloud load balancer
